name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint --workspace=@dwelling/backend

      - name: Check backend formatting
        run: npm run format:check --workspace=@dwelling/backend

      - name: Run backend tests
        run: npm test --workspace=@dwelling/backend

  database-test:
    name: Database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dwelling
          POSTGRES_PASSWORD: dwelling
          POSTGRES_DB: dwelling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://dwelling:dwelling@postgres:5432/dwelling_test?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify TEST_DATABASE_URL is set
        run: |
            if [ -z "$TEST_DATABASE_URL" ]; then
              echo "ERROR: TEST_DATABASE_URL must be set for database tests"
              exit 1
            fi

      - name: Run database tests
        run: npm test --workspace=@dwelling/backend -- tests/database.test.js

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint --workspace=@dwelling/frontend

      - name: Check frontend formatting
        run: npm run format:check --workspace=@dwelling/frontend

      - name: Run frontend tests
        run: npm test --workspace=@dwelling/frontend

      - name: Build frontend
        run: npm run build --workspace=@dwelling/frontend
